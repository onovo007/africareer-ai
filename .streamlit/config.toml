# Light, modern theme (OpenAI-style) + server settings for behind-proxy hosting (HF Spaces)
[theme]
base = "light"
primaryColor = "#4C6FFF"              # friendly blue accent
backgroundColor = "#FFFFFF"           # clean white
secondaryBackgroundColor = "#F4F6FA"  # soft light gray for panels, widgets, sidebar
textColor = "#15161B"                 # near-black, easy to read
font = "sans serif"

[server]
headless = true
# Required behind HF Spaces' proxy — without this the file uploader returns 403 (AxiosError)
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 25                    # MB — plenty for a CV, safer than the 200MB default

[browser]
gatherUsageStats = false
